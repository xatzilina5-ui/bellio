<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Lina Cafe - Πίνακας Σερβιτόρου</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="card">
    <h2>Κλήσεις Πελατών</h2>
    <div id="calls" class="list"></div>
  </div>

  <!-- 🔔 Προστέθηκε ο ήχος ειδοποίησης -->
  <audio id="alertSound" src="/ding.mp3" preload="auto"></audio>

  <script>
    const socket = io('/', { auth: { role: 'waiter' } });
    const list = document.getElementById('calls');
    const audio = document.getElementById('alertSound');

    function addCall(c) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<span>Τραπέζι ${c.tableId}</span>
        <button>Ολοκληρώθηκε</button>`;
      div.querySelector('button').onclick = () =>
        socket.emit('call:resolve', { callId: c.id });
      list.prepend(div);
      div.dataset.id = c.id;
    }

    socket.on('calls:init', cs => cs.forEach(addCall));

    // 🔔 Όταν φτάνει νέα κλήση:
    socket.on('call:new', c => {
      addCall(c);
      if (audio) {
        audio.currentTime = 0; // επανεκκίνηση ήχου
        audio.play().catch(() => {
          console.warn('Δεν έγινε αναπαραγωγή ήχου (πιθανόν από δικαιώματα browser)');
        });
      }
    });

    socket.on('call:resolved', ({ callId }) => {
      const item = [...list.children].find(x => x.dataset.id == callId);
      if (item) item.remove();
    });
  </script>
</body>
</html>
