<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Lina Cafe - Πίνακας Σερβιτόρου</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="card">
    <h2>Κλήσεις Πελατών</h2>
    <div id="calls" class="list"></div>
  </div>

  <script>
    const socket = io('/', { auth: { role: 'waiter' } });
    const list = document.getElementById('calls');

    function addCall(c) {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<span>Τραπέζι ${c.tableId}</span>
        <button>Ολοκληρώθηκε</button>`;
      div.querySelector('button').onclick = () =>
        socket.emit('call:resolve', { callId: c.id });
      list.prepend(div);
      div.dataset.id = c.id;
    }

    socket.on('calls:init', cs => cs.forEach(addCall));
    socket.on('call:new', addCall);
    socket.on('call:resolved', ({ callId }) => {
      const item = [...list.children].find(x => x.dataset.id == callId);
      if (item) item.remove();
    });
  </script>
</body>
</html>
